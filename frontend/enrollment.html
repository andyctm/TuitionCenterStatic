<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Enrollment — TCMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-nav="desktop-first">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">T</span><span class="brand-name">TCMS</span>
        </div>
        <nav class="nav-list">
          <a class="nav-item" href="accountant-dashboard.html"
            ><i data-icon="dashboard"></i
            ><span class="label">Dashboard</span></a
          >
          <a class="nav-item is-active" href="enrollment.html"
            ><i data-icon="enrollment"></i
            ><span class="label">Enrollment</span></a
          >
          <a class="nav-item" href="reports.html"
            ><i data-icon="reports"></i><span class="label">Reports</span></a
          >
        </nav>
        <div class="nav-footer">Colombo Main branch</div>
      </aside>
      <header class="topbar">
        <div class="breadcrumb">
          <button
            class="btn btn-ghost btn-icon menu-toggle"
            data-menu-toggle
            aria-label="Open navigation"
          >
            <i data-icon="menu"></i>
          </button>
          <span id="breadcrumb-role">Accountant</span><span class="sep">/</span
          ><span class="current">Enrollment</span>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-ghost btn-icon" aria-label="Notifications">
            <i data-icon="bell"></i>
          </button>
          <div class="user-chip">
            <span class="avatar" id="user-avatar">TM</span>
            <span class="meta"
              ><span class="name" id="user-name">Tharindu Mendis</span
              ><span class="role" id="user-role-label">Accountant</span></span
            >
            <button
              class="btn btn-ghost btn-icon"
              id="logout-btn"
              aria-label="Log out"
              title="Log out"
            >
              <i data-icon="logout" class="icon-sm"></i>
            </button>
          </div>
        </div>
      </header>
      <main class="content">
        <div class="page-header">
          <div>
            <h1>Enrollment</h1>
            <p class="subtitle" id="enrollment-subtitle">Loading…</p>
          </div>
          <div class="header-actions">
            <button class="btn btn-primary" data-open-modal="enroll-dialog">
              <i data-icon="plus" class="icon-sm"></i> Enroll Student
            </button>
          </div>
        </div>

        <section class="panel" data-filter-panel>
          <div
            class="panel-header"
            style="gap: var(--space-4); flex-wrap: wrap"
          >
            <div class="input-icon-wrap" style="max-width: 280px">
              <i data-icon="search" class="icon-sm"></i>
              <input
                class="input"
                placeholder="Search students…"
                data-filter-search
              />
            </div>
            <div style="display: flex; gap: var(--space-2); margin-left: auto">
              <select
                class="input"
                style="width: auto"
                data-filter-select="Status"
              >
                <option>Status: Active</option>
                <option>Status: Completed</option>
                <option>Status: Withdrawn</option>
                <option>Status: All</option>
              </select>
              <select
                class="input"
                style="width: auto"
                data-filter-select="Batch"
                id="enrollment-batch-filter"
              >
                <option>Batch: All</option>
              </select>
            </div>
          </div>
          <div class="panel-body no-pad table-wrap">
            <table class="data">
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Batch</th>
                  <th>Enrolled since</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="enrollment-table-body">
                <tr>
                  <td colspan="5" class="cell-secondary">Loading…</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <dialog id="enroll-dialog" class="modal">
      <div class="modal-header">
        <h2>Enroll a student</h2>
        <button
          class="btn btn-ghost btn-icon"
          data-close-modal
          aria-label="Close"
        >
          <i data-icon="x"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="student-search">Student</label>
          <div class="input-icon-wrap">
            <i data-icon="search" class="icon-sm"></i>
            <input
              class="input"
              id="student-search"
              placeholder="Search by name or student ID…"
              value="Nimasha Ranasinghe"
            />
          </div>
        </div>
        <div class="field">
          <label>Choose a batch</label>
          <div
            style="display: flex; flex-direction: column; gap: var(--space-2)"
          >
            <label class="seat-option" data-seat-option>
              <div class="row-people">
                <input type="radio" name="batch" />
                <div class="meta">
                  <div class="cell-primary">Grade 10 Mathematics</div>
                  <div class="sub">Mon/Wed/Fri · 8:00–9:30 AM · Room 2</div>
                </div>
              </div>
              <span class="seat-fill">18 / 30 seats</span>
            </label>
            <label class="seat-option" data-seat-option>
              <div class="row-people">
                <input type="radio" name="batch" />
                <div class="meta">
                  <div class="cell-primary">Grade 10 Mathematics — Evening</div>
                  <div class="sub">Tue/Thu · 5:00–6:30 PM · Room 1</div>
                </div>
              </div>
              <span class="seat-fill">22 / 25 seats</span>
            </label>
            <label class="seat-option is-full" data-seat-option>
              <div class="row-people">
                <input type="radio" name="batch" disabled />
                <div class="meta">
                  <div class="cell-primary">Grade 11 English</div>
                  <div class="sub">Mon/Wed/Fri · 11:15–12:30 PM · Room 3</div>
                </div>
              </div>
              <span class="seat-fill">30 / 30 seats</span>
            </label>
          </div>
          <div class="error-msg" data-seat-error hidden>
            <i data-icon="alertTriangle" class="icon-sm"></i>
            This batch is at full capacity (30/30). Choose another batch or a
            waitlist option.
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close-modal>Cancel</button>
        <button class="btn btn-primary" data-enroll-confirm disabled>
          Confirm Enrollment
        </button>
      </div>
    </dialog>

    <dialog id="manage-enrollment-dialog" class="modal">
      <div class="modal-header">
        <h2>Manage enrollment</h2>
        <button
          class="btn btn-ghost btn-icon"
          data-close-modal
          aria-label="Close"
        >
          <i data-icon="x"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>Student</label>
          <p id="manage-enrollment-student" class="cell-primary"></p>
        </div>
        <div class="field">
          <label>Batch</label>
          <p id="manage-enrollment-batch" class="cell-secondary"></p>
        </div>
        <div class="field">
          <label for="manage-enrollment-status">Status</label>
          <select class="input" id="manage-enrollment-status">
            <option value="ACTIVE">Active</option>
            <option value="COMPLETED">Completed</option>
            <option value="WITHDRAWN">Withdrawn</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close-modal>Cancel</button>
        <button class="btn btn-primary" data-manage-enrollment-save>
          Save Changes
        </button>
      </div>
    </dialog>

    <script src="js/icons.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
      const ENROLLMENT_STATUS_BADGES = {
        ACTIVE:
          '<span class="badge badge-success"><i data-icon="checkCircle"></i>Active</span>',
        COMPLETED:
          '<span class="badge badge-info"><i data-icon="checkCircle"></i>Completed</span>',
        WITHDRAWN:
          '<span class="badge badge-danger"><i data-icon="xCircle"></i>Withdrawn</span>',
      };

      let tcmsEnrollmentsCache = [];

      function initials(name) {
        return name
          .split(" ")
          .filter(Boolean)
          .slice(0, 2)
          .map((part) => part[0].toUpperCase())
          .join("");
      }

      function formatEnrolledDate(dateStr) {
        return new Date(dateStr).toLocaleDateString("en-GB", {
          day: "numeric",
          month: "short",
          year: "numeric",
        });
      }

      function renderEnrollmentRow(enrollment) {
        return `<tr>
          <td data-label="Student">
            <div class="row-people">
              <span class="avatar sm">${initials(enrollment.studentName)}</span>
              <div class="meta">
                <div>${enrollment.studentName}</div>
                <div class="sub">${enrollment.studentGradeLevel}</div>
              </div>
            </div>
          </td>
          <td data-label="Batch" class="cell-secondary">${enrollment.batchLabel}</td>
          <td data-label="Enrolled since" class="cell-secondary">${formatEnrolledDate(enrollment.enrolledAt)}</td>
          <td data-label="Status">${ENROLLMENT_STATUS_BADGES[enrollment.status]}</td>
          <td>
            <button class="btn btn-ghost btn-sm" data-manage-enrollment="${enrollment.id}">
              Manage
            </button>
          </td>
        </tr>`;
      }

      async function refreshEnrollments() {
        const tbody = document.getElementById("enrollment-table-body");
        const [enrollments, branches] = await Promise.all([
          tcmsApiFetch("/enrollments"),
          tcmsApiFetch("/branches"),
        ]);
        tcmsEnrollmentsCache = enrollments;

        const user = tcmsGetUser();
        const branch = user
          ? branches.find((b) => b.id === user.branchId)
          : null;
        document.getElementById("enrollment-subtitle").textContent = branch
          ? `${branch.name} \u00b7 showing active enrollments`
          : "All branches \u00b7 showing active enrollments";

        const batchLabels = [
          ...new Set(enrollments.map((e) => e.batchLabel)),
        ].sort();
        const batchSelect = document.getElementById("enrollment-batch-filter");
        const previousBatchValue = batchSelect.value;
        batchSelect.innerHTML =
          "<option>Batch: All</option>" +
          batchLabels.map((label) => `<option>${label}</option>`).join("");
        if (
          [...batchSelect.options].some(
            (o) => o.textContent === previousBatchValue,
          )
        ) {
          batchSelect.value = previousBatchValue;
        }

        tbody.innerHTML = enrollments.length
          ? enrollments.map(renderEnrollmentRow).join("")
          : '<tr><td colspan="5" class="cell-secondary">No enrollments yet.</td></tr>';
        renderIcons(tbody);
        tcmsApplyTableFilters();
      }

      function initManageEnrollment() {
        const dialog = document.getElementById("manage-enrollment-dialog");
        const studentEl = document.getElementById("manage-enrollment-student");
        const batchEl = document.getElementById("manage-enrollment-batch");
        const statusSelect = document.getElementById(
          "manage-enrollment-status",
        );
        const saveBtn = document.querySelector("[data-manage-enrollment-save]");
        let activeEnrollmentId = null;

        document
          .getElementById("enrollment-table-body")
          .addEventListener("click", (e) => {
            const btn = e.target.closest("[data-manage-enrollment]");
            if (!btn) return;
            activeEnrollmentId = btn.getAttribute("data-manage-enrollment");
            const enrollment = tcmsEnrollmentsCache.find(
              (en) => en.id === activeEnrollmentId,
            );
            if (!enrollment) return;
            studentEl.textContent = enrollment.studentName;
            batchEl.textContent = enrollment.batchLabel;
            statusSelect.value = enrollment.status;
            if (dialog.showModal) dialog.showModal();
          });

        saveBtn.addEventListener("click", async () => {
          if (!activeEnrollmentId) return;
          saveBtn.disabled = true;
          try {
            await tcmsApiFetch(`/enrollments/${activeEnrollmentId}`, {
              method: "PATCH",
              body: JSON.stringify({ status: statusSelect.value }),
            });
            dialog.close();
            await refreshEnrollments();
          } catch (err) {
            alert(err.message || "Could not update the enrollment status.");
          } finally {
            saveBtn.disabled = false;
          }
        });
      }

      (function () {
        const user = tcmsRequireAuth();
        if (!user) return;
        tcmsRenderSidebarForRole(user.role);
        document.getElementById("user-avatar").textContent =
          (user.firstName[0] || "") + (user.lastName[0] || "");
        document.getElementById("user-name").textContent =
          `${user.firstName} ${user.lastName}`;
        document.getElementById("user-role-label").textContent = tcmsRoleLabel(
          user.role,
        );
        document
          .getElementById("logout-btn")
          .addEventListener("click", tcmsLogout);
        initManageEnrollment();
        refreshEnrollments().catch((err) => {
          document.getElementById("enrollment-table-body").innerHTML =
            `<tr><td colspan="5" class="cell-secondary">Failed to load enrollments: ${err.message}</td></tr>`;
        });
      })();
    </script>
  </body>
</html>
