<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Enrollment — TCMS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body data-nav="desktop-first">
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <span class="brand-mark">T</span><span class="brand-name">TCMS</span>
        </div>
        <nav class="nav-list">
          <a class="nav-item" href="accountant-dashboard.html"
            ><i data-icon="dashboard"></i
            ><span class="label">Dashboard</span></a
          >
          <a class="nav-item is-active" href="enrollment.html"
            ><i data-icon="enrollment"></i
            ><span class="label">Enrollment</span></a
          >
          <a class="nav-item" href="reports.html"
            ><i data-icon="reports"></i><span class="label">Reports</span></a
          >
        </nav>
        <div class="nav-footer">Colombo Main branch</div>
      </aside>
      <header class="topbar">
        <div class="breadcrumb">
          <button
            class="btn btn-ghost btn-icon menu-toggle"
            data-menu-toggle
            aria-label="Open navigation"
          >
            <i data-icon="menu"></i>
          </button>
          <span id="breadcrumb-role">Accountant</span><span class="sep">/</span
          ><span class="current">Enrollment</span>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-ghost btn-icon" aria-label="Notifications">
            <i data-icon="bell"></i>
          </button>
          <div class="user-chip">
            <span class="avatar" id="user-avatar">TM</span>
            <span class="meta"
              ><span class="name" id="user-name">Tharindu Mendis</span
              ><span class="role" id="user-role-label">Accountant</span></span
            >
            <button
              class="btn btn-ghost btn-icon"
              id="logout-btn"
              aria-label="Log out"
              title="Log out"
            >
              <i data-icon="logout" class="icon-sm"></i>
            </button>
          </div>
        </div>
      </header>
      <main class="content">
        <div class="page-header">
          <div>
            <h1>Enrollment</h1>
            <p class="subtitle" id="enrollment-subtitle">Loading…</p>
          </div>
          <div class="header-actions">
            <button class="btn btn-primary" data-open-modal="enroll-dialog">
              <i data-icon="plus" class="icon-sm"></i> Enroll Student
            </button>
          </div>
        </div>

        <section class="panel" data-filter-panel>
          <div
            class="panel-header"
            style="gap: var(--space-4); flex-wrap: wrap"
          >
            <div class="input-icon-wrap" style="max-width: 280px">
              <i data-icon="search" class="icon-sm"></i>
              <input
                class="input"
                placeholder="Search students…"
                data-filter-search
              />
            </div>
            <div style="display: flex; gap: var(--space-2); margin-left: auto">
              <select
                class="input"
                style="width: auto"
                data-filter-select="Status"
              >
                <option>Status: Active</option>
                <option>Status: Completed</option>
                <option>Status: Withdrawn</option>
                <option>Status: All</option>
              </select>
              <select
                class="input"
                style="width: auto"
                data-filter-select="Batch"
                id="enrollment-batch-filter"
              >
                <option>Batch: All</option>
              </select>
            </div>
          </div>
          <div class="panel-body no-pad table-wrap">
            <table class="data">
              <thead>
                <tr>
                  <th>Student</th>
                  <th>Batch</th>
                  <th>Enrolled since</th>
                  <th>Status</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="enrollment-table-body">
                <tr>
                  <td colspan="5" class="cell-secondary">Loading…</td>
                </tr>
              </tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <dialog id="enroll-dialog" class="modal">
      <div class="modal-header">
        <h2>Enroll a student</h2>
        <button
          class="btn btn-ghost btn-icon"
          data-close-modal
          aria-label="Close"
        >
          <i data-icon="x"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label for="student-search">Student</label>
          <div class="input-icon-wrap">
            <i data-icon="search" class="icon-sm"></i>
            <input
              class="input"
              id="student-search"
              placeholder="Search by name or email…"
            />
          </div>
          <div
            id="student-results"
            style="
              display: flex;
              flex-direction: column;
              gap: var(--space-2);
              margin-top: var(--space-2);
              max-height: 200px;
              overflow-y: auto;
            "
          ></div>
        </div>
        <div class="field">
          <label>Choose a batch</label>
          <div
            id="batch-results"
            style="display: flex; flex-direction: column; gap: var(--space-2)"
          ></div>
          <div class="error-msg" data-seat-error hidden>
            <i data-icon="alertTriangle" class="icon-sm"></i>
            <span data-seat-error-text></span>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close-modal>Cancel</button>
        <button class="btn btn-primary" data-enroll-confirm disabled>
          Confirm Enrollment
        </button>
      </div>
    </dialog>

    <dialog id="manage-enrollment-dialog" class="modal">
      <div class="modal-header">
        <h2>Manage enrollment</h2>
        <button
          class="btn btn-ghost btn-icon"
          data-close-modal
          aria-label="Close"
        >
          <i data-icon="x"></i>
        </button>
      </div>
      <div class="modal-body">
        <div class="field">
          <label>Student</label>
          <p id="manage-enrollment-student" class="cell-primary"></p>
        </div>
        <div class="field">
          <label>Batch</label>
          <p id="manage-enrollment-batch" class="cell-secondary"></p>
        </div>
        <div class="field">
          <label for="manage-enrollment-status">Status</label>
          <select class="input" id="manage-enrollment-status">
            <option value="ACTIVE">Active</option>
            <option value="COMPLETED">Completed</option>
            <option value="WITHDRAWN">Withdrawn</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-close-modal>Cancel</button>
        <button class="btn btn-primary" data-manage-enrollment-save>
          Save Changes
        </button>
      </div>
    </dialog>

    <script src="js/icons.js"></script>
    <script src="js/config.js"></script>
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
      const ENROLLMENT_STATUS_BADGES = {
        ACTIVE:
          '<span class="badge badge-success"><i data-icon="checkCircle"></i>Active</span>',
        COMPLETED:
          '<span class="badge badge-info"><i data-icon="checkCircle"></i>Completed</span>',
        WITHDRAWN:
          '<span class="badge badge-danger"><i data-icon="xCircle"></i>Withdrawn</span>',
      };

      let tcmsEnrollmentsCache = [];

      function initials(name) {
        return name
          .split(" ")
          .filter(Boolean)
          .slice(0, 2)
          .map((part) => part[0].toUpperCase())
          .join("");
      }

      function formatEnrolledDate(dateStr) {
        return new Date(dateStr).toLocaleDateString("en-GB", {
          day: "numeric",
          month: "short",
          year: "numeric",
        });
      }

      function renderEnrollmentRow(enrollment) {
        return `<tr>
          <td data-label="Student">
            <div class="row-people">
              <span class="avatar sm">${initials(enrollment.studentName)}</span>
              <div class="meta">
                <div>${enrollment.studentName}</div>
                <div class="sub">${enrollment.studentGradeLevel}</div>
              </div>
            </div>
          </td>
          <td data-label="Batch" class="cell-secondary">${enrollment.batchLabel}</td>
          <td data-label="Enrolled since" class="cell-secondary">${formatEnrolledDate(enrollment.enrolledAt)}</td>
          <td data-label="Status">${ENROLLMENT_STATUS_BADGES[enrollment.status]}</td>
          <td>
            <button class="btn btn-ghost btn-sm" data-manage-enrollment="${enrollment.id}">
              Manage
            </button>
          </td>
        </tr>`;
      }

      async function refreshEnrollments() {
        const tbody = document.getElementById("enrollment-table-body");
        const [enrollments, branches] = await Promise.all([
          tcmsApiFetch("/enrollments"),
          tcmsApiFetch("/branches"),
        ]);
        tcmsEnrollmentsCache = enrollments;

        const user = tcmsGetUser();
        const branch = user
          ? branches.find((b) => b.id === user.branchId)
          : null;
        document.getElementById("enrollment-subtitle").textContent = branch
          ? `${branch.name} \u00b7 showing active enrollments`
          : "All branches \u00b7 showing active enrollments";

        const batchLabels = [
          ...new Set(enrollments.map((e) => e.batchLabel)),
        ].sort();
        const batchSelect = document.getElementById("enrollment-batch-filter");
        const previousBatchValue = batchSelect.value;
        batchSelect.innerHTML =
          "<option>Batch: All</option>" +
          batchLabels.map((label) => `<option>${label}</option>`).join("");
        if (
          [...batchSelect.options].some(
            (o) => o.textContent === previousBatchValue,
          )
        ) {
          batchSelect.value = previousBatchValue;
        }

        tbody.innerHTML = enrollments.length
          ? enrollments.map(renderEnrollmentRow).join("")
          : '<tr><td colspan="5" class="cell-secondary">No enrollments yet.</td></tr>';
        renderIcons(tbody);
        tcmsApplyTableFilters();
      }

      function initManageEnrollment() {
        const dialog = document.getElementById("manage-enrollment-dialog");
        const studentEl = document.getElementById("manage-enrollment-student");
        const batchEl = document.getElementById("manage-enrollment-batch");
        const statusSelect = document.getElementById(
          "manage-enrollment-status",
        );
        const saveBtn = document.querySelector("[data-manage-enrollment-save]");
        let activeEnrollmentId = null;

        document
          .getElementById("enrollment-table-body")
          .addEventListener("click", (e) => {
            const btn = e.target.closest("[data-manage-enrollment]");
            if (!btn) return;
            activeEnrollmentId = btn.getAttribute("data-manage-enrollment");
            const enrollment = tcmsEnrollmentsCache.find(
              (en) => en.id === activeEnrollmentId,
            );
            if (!enrollment) return;
            studentEl.textContent = enrollment.studentName;
            batchEl.textContent = enrollment.batchLabel;
            statusSelect.value = enrollment.status;
            if (dialog.showModal) dialog.showModal();
          });

        saveBtn.addEventListener("click", async () => {
          if (!activeEnrollmentId) return;
          saveBtn.disabled = true;
          try {
            await tcmsApiFetch(`/enrollments/${activeEnrollmentId}`, {
              method: "PATCH",
              body: JSON.stringify({ status: statusSelect.value }),
            });
            dialog.close();
            await refreshEnrollments();
          } catch (err) {
            alert(err.message || "Could not update the enrollment status.");
          } finally {
            saveBtn.disabled = false;
          }
        });
      }

      let tcmsEnrollStudents = [];
      let tcmsEnrollBatches = [];
      let tcmsEnrollCourses = [];
      let tcmsEnrollSeats = new Map();
      let tcmsSelectedStudentProfileId = null;
      let tcmsSelectedBatchId = null;

      function renderStudentOptions(filterText) {
        const container = document.getElementById("student-results");
        const term = (filterText || "").trim().toLowerCase();
        const matches = tcmsEnrollStudents
          .filter((s) => {
            const haystack =
              `${s.firstName} ${s.lastName} ${s.email}`.toLowerCase();
            return !term || haystack.includes(term);
          })
          .slice(0, 8);
        container.innerHTML = matches.length
          ? matches
              .map(
                (s) => `<label class="seat-option" data-seat-option>
            <div class="row-people">
              <input type="radio" name="enroll-student" value="${s.studentProfileId}" ${s.studentProfileId === tcmsSelectedStudentProfileId ? "checked" : ""} />
              <div class="meta">
                <div class="cell-primary">${s.firstName} ${s.lastName}</div>
                <div class="sub">${s.email}</div>
              </div>
            </div>
          </label>`,
              )
              .join("")
          : '<p class="cell-secondary">No matching students in this branch.</p>';
        renderIcons(container);
      }

      function renderBatchOptions() {
        const container = document.getElementById("batch-results");
        container.innerHTML = tcmsEnrollBatches.length
          ? tcmsEnrollBatches
              .map((batch) => {
                const course = tcmsEnrollCourses.find(
                  (c) => c.id === batch.courseId,
                );
                const filled = tcmsEnrollSeats.get(batch.id) || 0;
                const isFull = filled >= batch.capacity;
                return `<label class="seat-option${isFull ? " is-full" : ""}" data-seat-option>
            <div class="row-people">
              <input type="radio" name="enroll-batch" value="${batch.id}" ${isFull ? "disabled" : ""} ${batch.id === tcmsSelectedBatchId ? "checked" : ""} />
              <div class="meta">
                <div class="cell-primary">${course ? course.name : "Unknown course"}</div>
                <div class="sub">Room ${batch.room} \u00b7 ${batch.term}</div>
              </div>
            </div>
            <span class="seat-fill">${filled} / ${batch.capacity}</span>
          </label>`;
              })
              .join("")
          : '<p class="cell-secondary">No active batches available for this branch yet.</p>';
        renderIcons(container);
      }

      async function loadEnrollDialogData() {
        const [students, batches, courses, activeEnrollments] =
          await Promise.all([
            tcmsApiFetch("/students"),
            tcmsApiFetch("/batches"),
            tcmsApiFetch("/courses"),
            tcmsApiFetch("/enrollments?status=ACTIVE"),
          ]);
        tcmsEnrollStudents = students;
        tcmsEnrollBatches = batches.filter((b) => b.status !== "ARCHIVED");
        tcmsEnrollCourses = courses;
        tcmsEnrollSeats = new Map();
        for (const enrollment of activeEnrollments) {
          tcmsEnrollSeats.set(
            enrollment.batchId,
            (tcmsEnrollSeats.get(enrollment.batchId) || 0) + 1,
          );
        }
      }

      function initEnrollDialog() {
        const dialog = document.getElementById("enroll-dialog");
        const openBtn = document.querySelector(
          '[data-open-modal="enroll-dialog"]',
        );
        const searchInput = document.getElementById("student-search");
        const studentResults = document.getElementById("student-results");
        const batchResults = document.getElementById("batch-results");
        const confirmBtn = document.querySelector("[data-enroll-confirm]");
        const errorEl = document.querySelector("[data-seat-error]");
        const errorText = document.querySelector("[data-seat-error-text]");

        function updateConfirmState() {
          confirmBtn.disabled =
            !tcmsSelectedStudentProfileId || !tcmsSelectedBatchId;
        }

        openBtn.addEventListener("click", async () => {
          tcmsSelectedStudentProfileId = null;
          tcmsSelectedBatchId = null;
          searchInput.value = "";
          errorEl.hidden = true;
          updateConfirmState();
          studentResults.innerHTML = '<p class="cell-secondary">Loading…</p>';
          batchResults.innerHTML = '<p class="cell-secondary">Loading…</p>';
          try {
            await loadEnrollDialogData();
            renderStudentOptions("");
            renderBatchOptions();
          } catch (err) {
            studentResults.innerHTML = `<p class="cell-secondary">Failed to load students: ${err.message}</p>`;
            batchResults.innerHTML = "";
          }
        });

        searchInput.addEventListener("input", () =>
          renderStudentOptions(searchInput.value),
        );

        studentResults.addEventListener("change", (e) => {
          if (e.target.name === "enroll-student") {
            tcmsSelectedStudentProfileId = e.target.value;
            updateConfirmState();
          }
        });

        batchResults.addEventListener("change", (e) => {
          if (e.target.name === "enroll-batch") {
            tcmsSelectedBatchId = e.target.value;
            errorEl.hidden = true;
            updateConfirmState();
          }
        });

        confirmBtn.addEventListener("click", async () => {
          if (!tcmsSelectedStudentProfileId || !tcmsSelectedBatchId) return;
          confirmBtn.disabled = true;
          errorEl.hidden = true;
          try {
            await tcmsApiFetch("/enrollments", {
              method: "POST",
              body: JSON.stringify({
                batchId: tcmsSelectedBatchId,
                studentProfileId: tcmsSelectedStudentProfileId,
              }),
            });
            dialog.close();
            await refreshEnrollments();
          } catch (err) {
            errorText.textContent =
              err.message || "Could not enroll this student.";
            errorEl.hidden = false;
          } finally {
            confirmBtn.disabled = false;
          }
        });
      }

      (function () {
        const user = tcmsRequireAuth();
        if (!user) return;
        tcmsRenderSidebarForRole(user.role);
        document.getElementById("user-avatar").textContent =
          (user.firstName[0] || "") + (user.lastName[0] || "");
        document.getElementById("user-name").textContent =
          `${user.firstName} ${user.lastName}`;
        document.getElementById("user-role-label").textContent = tcmsRoleLabel(
          user.role,
        );
        document
          .getElementById("logout-btn")
          .addEventListener("click", tcmsLogout);
        initManageEnrollment();
        initEnrollDialog();
        refreshEnrollments().catch((err) => {
          document.getElementById("enrollment-table-body").innerHTML =
            `<tr><td colspan="5" class="cell-secondary">Failed to load enrollments: ${err.message}</td></tr>`;
        });
      })();
    </script>
  </body>
</html>
